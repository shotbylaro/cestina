  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:300000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},key,u(C)));
  try{localStorage.setItem("heslo",pw)}catch(_){}
  document.open();document.write(html);document.close();
}
